<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Jungle Analytics Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.3); }
        .stat-card { transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div id="app"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCI4Fsf6vUwnYAGvraeBVxurhUvjgaJy9s",
            authDomain: "little-jungle-pos.firebaseapp.com",
            projectId: "little-jungle-pos",
            storageBucket: "little-jungle-pos.firebasestorage.app",
            messagingSenderId: "298080389561",
            appId: "1:298080389561:web:fe1e9d8ddd03f41c8f4e68",
            measurementId: "G-RFBM6YH2RG"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const DASHBOARD_PASSWORD = "jungle2024";
        let isAuthenticated = false;
        let salesData = [];
        let autoRefresh = null;
        let paymentChart = null; // Store chart instance
        let datePicker = null;   // Store flatpickr instance

        // Default to today
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        let dateRange = { start: today, end: today };

        class Dashboard {
            constructor() {
                this.checkAuth();
            }

            checkAuth() {
                if (localStorage.getItem('dashboard_auth') === 'true') {
                    isAuthenticated = true;
                    this.loadData();
                    this.startAutoRefresh();
                } else {
                    this.showLogin();
                }
            }

            showLogin() {
                document.getElementById('app').innerHTML = `
                    <div class="max-w-md mx-auto mt-20">
                        <div class="glass rounded-2xl shadow-2xl p-8">
                            <div class="text-center mb-8">
                                <h1 class="text-3xl font-bold text-purple-800 mb-2">🌴 Little Jungle</h1>
                                <p class="text-gray-600">Analytics Dashboard</p>
                            </div>
                            <input type="password" id="password" placeholder="Enter Dashboard Password"
                                class="w-full px-4 py-3 border-2 border-purple-200 rounded-lg focus:outline-none focus:border-purple-500"
                                onkeypress="if(event.key==='Enter') dashboard.login()">
                            <button onclick="dashboard.login()"
                                class="w-full mt-4 bg-gradient-to-r from-purple-600 to-blue-600 text-white py-3 rounded-lg font-bold hover:from-purple-700 hover:to-blue-700">
                                🔓 Access Dashboard
                            </button>
                        </div>
                    </div>`;
            }

            login() {
                const pwd = document.getElementById('password').value;
                if (pwd === DASHBOARD_PASSWORD) {
                    isAuthenticated = true;
                    localStorage.setItem('dashboard_auth', 'true');
                    this.loadData();
                    this.startAutoRefresh();
                } else {
                    alert('❌ Incorrect password!');
                }
            }

            logout() {
                isAuthenticated = false;
                localStorage.removeItem('dashboard_auth');
                this.stopAutoRefresh();
                if (paymentChart) paymentChart.destroy();
                this.showLogin();
            }

            async loadData() {
                try {
                    const snapshot = await db.collection('sales').orderBy('timestamp', 'desc').get();
                    salesData = snapshot.docs.map(doc => {
                        const data = doc.data();
                        // Ensure date is properly parsed as local date
                        if (data.date) {
                            const [year, month, day] = data.date.split('-');
                            data.dateObj = new Date(year, month - 1, day);
                            data.dateObj.setHours(0, 0, 0, 0);
                        }
                        return data;
                    });
                    this.renderDashboard();
                } catch (err) {
                    console.error("Load error:", err);
                    salesData = [];
                    this.renderDashboard();
                }
            }

            startAutoRefresh() {
                autoRefresh = setInterval(() => this.loadData(), 30000);
            }

            stopAutoRefresh() {
                if (autoRefresh) clearInterval(autoRefresh);
            }

            getFilteredSales() {
                if (!dateRange.start || !dateRange.end) return salesData;
                return salesData.filter(sale => {
                    if (!sale.dateObj) return false;
                    return sale.dateObj >= dateRange.start && sale.dateObj <= dateRange.end;
                });
            }

            setToday() {
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                dateRange.start = dateRange.end = today;
                if (datePicker) datePicker.setDate([today, today]);
                this.renderDashboard();
            }

            renderDashboard() {
                const filteredSales = this.getFilteredSales();
                const totalSales = filteredSales.reduce((sum, s) => sum + s.total, 0);
                const totalTips = filteredSales.reduce((sum, s) => sum + (s.tip || 0), 0);
                const transactions = filteredSales.length;

                // Calculate number of days in range
                const daysInPeriod = dateRange.start && dateRange.end
                    ? Math.floor((dateRange.end - dateRange.start) / (1000 * 60 * 60 * 24)) + 1
                    : 1;

                const avgDailySales = daysInPeriod > 0 ? totalSales / daysInPeriod : 0;
                const avgTicket = transactions > 0 ? totalSales / transactions : 0;

                // Top items
                const itemMap = {};
                filteredSales.forEach(sale => {
                    sale.items.forEach(i => {
                        const name = i.name || 'Unknown';
                        if (!itemMap[name]) itemMap[name] = { name, qty: 0, revenue: 0 };
                        itemMap[name].qty += i.quantity || 1;
                        itemMap[name].revenue += i.price * (i.quantity || 1);
                    });
                });
                const topItems = Object.values(itemMap).sort((a, b) => b.qty - a.qty).slice(0, 5);

                // Waiters
                const waiterMap = {};
                filteredSales.forEach(sale => {
                    const name = sale.waiter?.name || 'Unknown';
                    if (!waiterMap[name]) waiterMap[name] = { name, sales: 0, tips: 0, transactions: 0 };
                    waiterMap[name].sales += sale.total;
                    waiterMap[name].tips += sale.tip || 0;
                    waiterMap[name].transactions += 1;
                });
                const topWaiters = Object.values(waiterMap).sort((a, b) => b.sales - a.sales);

                // Payment methods
                const cash = filteredSales.filter(s => s.paymentMethod === 'Cash').reduce((sum, s) => sum + s.total, 0);
                const card = filteredSales.filter(s => s.paymentMethod === 'Card').reduce((sum, s) => sum + s.total, 0);

                // Period text
                const format = d => d.toLocaleDateString('en-ZA', { day: '2-digit', month: '2-digit', year: 'numeric' });
                const periodText = dateRange.start && dateRange.end
                    ? dateRange.start.getTime() === dateRange.end.getTime()
                        ? format(dateRange.start)
                        : `${format(dateRange.start)} → ${format(dateRange.end)}`
                    : 'No date selected';

                document.getElementById('app').innerHTML = `
                    <div class="max-w-7xl mx-auto">
                        <div class="glass rounded-2xl shadow-xl p-6 mb-6">
                            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                                <div>
                                    <h1 class="text-3xl font-bold text-purple-800 mb-1">🌴 Little Jungle Analytics</h1>
                                    <p class="text-gray-600">Real-time Business Intelligence • ${periodText}</p>
                                </div>
                                <div class="flex flex-wrap items-center gap-3">
                                    <button onclick="dashboard.setToday()" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg text-sm font-medium">Today</button>
                                    <input type="text" id="dateRangePicker" placeholder="Select date range" 
                                        class="px-4 py-2 border-2 border-purple-300 rounded-lg focus:outline-none focus:border-purple-600 text-sm">
                                    <button onclick="dashboard.loadData()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg font-medium">Refresh</button>
                                    <button onclick="dashboard.logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg font-medium">Logout</button>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
                            <div class="stat-card glass rounded-xl shadow-lg p-6">
                                <div class="flex items-center justify-between mb-2"><p class="text-gray-600 text-sm font-semibold">PERIOD SALES</p><span>💰</span></div>
                                <p class="text-3xl font-bold text-green-600">R${totalSales.toFixed(2)}</p>
                                <p class="text-xs text-gray-500">${transactions} transactions</p>
                            </div>
                            <div class="stat-card glass rounded-xl shadow-lg p-6">
                                <div class="flex items-center justify-between mb-2"><p class="text-gray-600 text-sm font-semibold">DAILY AVERAGE</p><span>📊</span></div>
                                <p class="text-3xl font-bold text-blue-600">R${avgDailySales.toFixed(2)}</p>
                                <p class="text-xs text-gray-500">over ${daysInPeriod} day${daysInPeriod > 1 ? 's' : ''}</p>
                            </div>
                            <div class="stat-card glass rounded-xl shadow-lg p-6">
                                <div class="flex items-center justify-between mb-2"><p class="text-gray-600 text-sm font-semibold">TOTAL TIPS</p><span>🎁</span></div>
                                <p class="text-3xl font-bold text-orange-600">R${totalTips.toFixed(2)}</p>
                                <p class="text-xs text-gray-500">${totalSales > 0 ? ((totalTips/totalSales)*100).toFixed(1) : '0'}% of sales</p>
                            </div>
                            <div class="stat-card glass rounded-xl shadow-lg p-6">
                                <div class="flex items-center justify-between mb-2"><p class="text-gray-600 text-sm font-semibold">AVG TICKET</p><span>🧾</span></div>
                                <p class="text-3xl font-bold text-purple-600">R${avgTicket.toFixed(2)}</p>
                                <p class="text-xs text-gray-500">per transaction</p>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                            <div class="glass rounded-xl shadow-lg p-6">
                                <h3 class="text-xl font-bold text-gray-800 mb-4">💳 Payment Methods</h3>
                                <canvas id="paymentChart"></canvas>
                            </div>
                            <div class="glass rounded-xl shadow-lg p-6">
                                <h3 class="text-xl font-bold text-gray-800 mb-4">🔥 Top Selling Items</h3>
                                <div class="space-y-3">
                                    ${topItems.length === 0 ? '<p class="text-gray-500 text-center py-8">No sales in selected period</p>' :
                                        topItems.map((item, i) => `
                                            <div class="flex justify-between p-3 bg-gradient-to-r from-orange-50 to-yellow-50 rounded-lg">
                                                <div class="flex items-center gap-3">
                                                    <span class="text-2xl font-bold text-orange-600">#${i+1}</span>
                                                    <div><p class="font-semibold">${item.name}</p><p class="text-xs text-gray-500">${item.qty} sold</p></div>
                                                </div>
                                                <p class="font-bold text-green-600">R${item.revenue.toFixed(2)}</p>
                                            </div>`).join('')}
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div class="glass rounded-xl shadow-lg p-6">
                                <h3 class="text-xl font-bold text-gray-800 mb-4">👥 Waiter Performance</h3>
                                ${topWaiters.length === 0 ? '<p class="text-gray-500 text-center py-8">No sales in period</p>' :
                                    topWaiters.map((w, i) => `
                                        <div class="p-3 bg-gradient-to-r from-blue-50 to-purple-50 rounded-lg mb-3">
                                            <div class="flex justify-between mb-1">
                                                <span class="font-bold ${i===0?'text-yellow-600':'text-gray-700'}">${i===0?'🏆':`#${i+1}`} ${w.name}</span>
                                                <span class="font-bold text-green-600">R${w.sales.toFixed(2)}</span>
                                            </div>
                                            <div class="text-xs text-gray-600 flex gap-4">
                                                <span>💼 ${w.transactions} tables</span>
                                                <span>🧾 R${(w.sales/w.transactions).toFixed(2)} avg</span>
                                                <span>🎁 R${w.tips.toFixed(2)} tips</span>
                                            </div>
                                        </div>`).join('')}
                            </div>

                            <div class="glass rounded-xl shadow-lg p-6">
                                <h3 class="text-xl font-bold text-gray-800 mb-4">📝 Recent Transactions</h3>
                                <div class="overflow-x-auto text-sm">
                                    <table class="w-full">
                                        <thead class="border-b-2 border-gray-300">
                                            <tr>
                                                <th class="text-left py-2">Date & Time</th>
                                                <th class="text-left py-2">Table</th>
                                                <th class="text-left py-2">Waiter</th>
                                                <th class="text-left py-2">Items</th>
                                                <th class="text-left py-2">Pay</th>
                                                <th class="text-right py-2">Total</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${filteredSales.slice(0, 15).map(s => `
                                                <tr class="border-b hover:bg-gray-50">
                                                    <td>${new Date(s.timestamp).toLocaleString('en-ZA', {dateStyle:'short', timeStyle:'short'})}</td>
                                                    <td class="font-semibold">${s.tableName || '-'}</td>
                                                    <td>${s.waiter?.name || '-'}</td>
                                                    <td>${s.items.length}</td>
                                                    <td><span class="px-2 py-1 rounded text-xs ${s.paymentMethod==='Cash'?'bg-green-100 text-green-800':'bg-blue-100 text-blue-800'}">${s.paymentMethod || 'N/A'}</span></td>
                                                    <td class="text-right font-bold text-green-600">R${s.total.toFixed(2)}</td>
                                                </tr>`).join('')}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>`;

                // Initialize or update flatpickr only once
                if (!datePicker) {
                    datePicker = flatpickr("#dateRangePicker", {
                        mode: "range",
                        dateFormat: "Y-m-d",
                        defaultDate: [dateRange.start, dateRange.end],
                        onChange: (selectedDates) => {
                            if (selectedDates.length === 2) {
                                dateRange.start = selectedDates[0];
                                dateRange.end = selectedDates[1];
                                dateRange.start.setHours(0, 0, 0, 0);
                                dateRange.end.setHours(0, 0, 0, 0);
                                this.renderDashboard();
                            }
                        }
                    });
                } else {
                    datePicker.setDate([dateRange.start, dateRange.end], false);
                }

                // Update chart safely
                if (paymentChart) paymentChart.destroy();
                const ctx = document.getElementById('paymentChart');
                if (ctx && (cash > 0 || card > 0)) {
                    paymentChart = new Chart(ctx, {
                        type: 'doughnut',
                        data: {
                            labels: ['Cash', 'Card'],
                            datasets: [{
                                data: [cash, card],
                                backgroundColor: ['#22c55e', '#3b82f6'],
                                borderWidth: 0
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: { legend: { position: 'bottom' } }
                        }
                    });
                }
            }
        }

        const dashboard = new Dashboard();
    </script>
</body>
</html>
