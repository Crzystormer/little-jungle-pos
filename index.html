            const printViaNetwork = async (content) => {
    try {
        const address = 'http://192.168.0.163/cgi-bin/epos/service.cgi?devid=local_printer&timeout=60000';
        const printer = new epson.ePOSPrint(address);

        const builder = new epson.ePOSBuilder();
        builder.addTextAlign(builder.ALIGN_CENTER);
        builder.addTextFont(builder.FONT_A);
        builder.addTextSize(1, 1);
        builder.addText(content);

		// ---- THIS IS THE IMPORTANT PART ----
        builder.addText('\n\n\n\n');           // 4 blank lines = ~15–20 mm of feed
        builder.addCut(builder.CUT_FEED);      // or CUT_NO_FEED if you prefer
        // ------------------------------------

        builder.addCut(builder.CUT_FEED);

        printer.open();
        printer.send(builder.toString());
        printer.close();

        console.log('Printed to receipt printer');
        return true;

                ">Submit</button>
            </div>
        `;

        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        const input = modal.querySelector('#managerPinInput');
        const cancelBtn = modal.querySelector('#pinCancel');
        const submitBtn = modal.querySelector('#pinSubmit');

            document.body.removeChild(overlay);

            const addToCart = (item) => {

        {reportsSubTab === 'items' && (
            <div>
                <h3 className="text-xl font-bold mb-4">📦 Items Sold Report</h3>
                {getFilteredSales().length === 0 ? (
                    <p className="text-center py-8 text-gray-500">No sales in selected period</p>
                ) : (
                    <div className="space-y-3 max-h-96 overflow-y-auto">
                        {(() => {
                            const itemSummary = {};
                            getFilteredSales().forEach(sale => {
                                sale.items.forEach(item => {
                                    const key = item.name;
                                    if (!itemSummary[key]) {
                                        itemSummary[key] = { name: item.name, category: item.category, quantity: 0, revenue: 0 };
                                    }
                                    itemSummary[key].quantity += item.quantity;
                                    itemSummary[key].revenue += item.price * item.quantity;
                                });
                            });
                            return Object.values(itemSummary)
                                .sort((a, b) => b.quantity - a.quantity)
                                .map(item => (
                                    <div key={item.name} className="bg-white rounded-lg p-4 shadow-sm border">
                                        <div className="flex justify-between">
                                            <div>
                                                <p className="font-bold">{item.name}</p>
                                                <p className="text-sm text-gray-500">{item.category}</p>
                                            </div>
                                            <div className="text-right">
                                                <p className="font-bold text-lg">x{item.quantity}</p>
                                                <p className="text-green-600 font-semibold">R{item.revenue.toFixed(2)}</p>
                                            </div>
                                        </div>
                                    </div>
                                ));
                        })()}
                    </div>
                )}
            </div>
        )}

        {/* VOID REPORT SUB-TAB */}
        {reportsSubTab === 'voids' && (
            <div>
                <h3 className="text-xl font-bold mb-4 text-red-700">❌ Void Report</h3>
                
                <div className="bg-red-50 p-4 rounded-lg mb-6 border-2 border-red-300">
                    <p className="font-bold text-red-800">Total Voided Amount: 
                        <span className="text-3xl ml-3">R{voidLog.reduce((sum, v) => sum + v.value, 0).toFixed(2)}</span>
                    </p>
                    <p className="text-sm text-red-700 mt-2">Total Actions: {voidLog.length}</p>
                </div>

                                                {voidLog.length === 0 ? (
                                    <div className="text-center py-12 text-gray-500">
                                        <p className="text-xl">No voids recorded yet.</p>
                                    </div>
                                ) : (
                                    <div className="space-y-4 max-h-screen overflow-y-auto pb-20">
                                        {voidLog.map((entry) => (
                                            <div key={entry.id} className="bg-white border-2 border-red-200 rounded-lg p-4 shadow-sm">
                                                <div className="flex justify-between items-start mb-2">
                                                    <div>
                                                        <p className="font-bold text-lg text-red-700">
                                                            {entry.type === 'clear' ? '🗑️ Full Table Clear' : '❌ Item Void'}
                                                        </p>
                                                        <p className="text-sm text-gray-600">
                                                            Table: <span className="font-semibold">{entry.tableName}</span> | {entry.timestamp}
                                                        </p>
                                                    </div>
                                                    <p className="text-2xl font-bold text-red-600">-R{entry.value.toFixed(2)}</p>
                                                </div>
                                                <div className="mt-2 text-sm text-gray-700">
                                                    <p className="font-semibold">Waiter: {entry.waiterName || 'Unknown'}</p>
                                                    {entry.type === 'item' ? (
                                                        <p>{entry.quantity}x {entry.itemName}</p>
                                                    ) : (
                                                        <p>Cleared {entry.itemsCount} item(s)</p>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
    </div>
)}

                            {activeTab === 'endofday' && (
                                <div>
                                    <h2 className="text-2xl font-bold mb-6">End of Day</h2>
                                    <div className="bg-gradient-to-r from-green-500 to-blue-500 text-white p-6 rounded-lg mb-6">
                                        <h3 className="text-xl font-bold mb-2">Today's Summary</h3>
                                        <p className="text-3xl font-bold">Total: R{getTodaySales().toFixed(2)}</p>
                                        <p className="text-lg">Tips: R{sales.reduce((sum, s) => sum + (s.tip || 0), 0).toFixed(2)}</p>
                                    </div>
                                    <div className="grid grid-cols-3 gap-6 mb-6">
                                        <div className="bg-green-50 p-6 rounded-lg">
                                            <p className="text-gray-600 mb-2">Cash</p>
                                            <p className="text-2xl font-bold text-green-600">R{sales.filter(s => s.paymentMethod === 'Cash').reduce((sum, s) => sum + s.total, 0).toFixed(2)}</p>
                                        </div>
                                        <div className="bg-blue-50 p-6 rounded-lg">
                                            <p className="text-gray-600 mb-2">Card</p>
                                            <p className="text-2xl font-bold text-blue-600">R{sales.filter(s => s.paymentMethod === 'Card').reduce((sum, s) => sum + s.total, 0).toFixed(2)}</p>
                                        </div>
                                        <div className="bg-purple-50 p-6 rounded-lg">
                                            <p className="text-gray-600 mb-2">Transactions</p>
                                            <p className="text-2xl font-bold text-purple-600">{sales.length}</p>
                                        </div>
                                    </div>
                                    <div className="bg-yellow-50 border-2 border-yellow-400 p-4 rounded-lg mb-6">
                                        <h3 className="font-bold text-yellow-800 mb-2">⚠️ Warning</h3>
                                        <p className="text-yellow-800">Finalizing End of day will print report and reset daily sales. Historical data preserved.</p>
                                    </div>
                                    <button onClick={finalizeDayCashUp} className="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-4 rounded-lg text-lg">
                                        Finalize End of Day & Reset
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('Service Worker registered'))
                .catch(err => console.log('Service Worker registration failed:', err));
            });
        }
        ReactDOM.render(<LittleJunglePOS />, document.getElementById('root'));
    </script>
</body>

</html>
